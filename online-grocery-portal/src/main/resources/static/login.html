<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RowdyPantry - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white fs-4" href="index.html">RowdyPantry</a>
        <div class="d-flex align-items-center gap-3">
            <a href="cart.html" class="btn btn-outline-light position-relative">
                Cart
                <span id="cart-badge" class="badge bg-danger rounded-pill">0</span>
            </a>
            <a href="login.html" class="btn btn-light btn-sm fw-semibold">Login</a>
        </div>
    </div>
</nav>

<!-- Main Login Form -->
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-summary">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 fw-bold text-primary">Welcome Back</h3>

                    <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Sign In</button>
                    </form>

                    <p class="text-center text-muted mt-3 mb-0">
                        Don't have an account? <a href="register.html" class="text-primary fw-bold">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/login.js"></script>
</body>
</html>
