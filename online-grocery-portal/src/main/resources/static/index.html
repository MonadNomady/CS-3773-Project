<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RowdyPantry - Online Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white fs-4" href="index.html">RowdyPantry</a>
        <div class="d-flex align-items-center gap-3">
            <a href="cart.html" class="btn btn-outline-light position-relative">
                Cart <span id="cart-badge" class="badge bg-danger rounded-pill">0</span>
            </a>
            <!-- Dynamic Auth Container -->
            <div id="navbar-auth-container"></div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="container my-4">
    <!-- Search & Filter Controls -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <input type="text" id="search-input" class="form-control" placeholder="Search groceries...">
        </div>
        <div class="col-md-3">
            <select id="sort-select" class="form-select">
                <option value="">Sort by Price</option>
                <option value="priceAsc">Price: Low to High</option>
                <option value="priceDesc">Price: High to Low</option>
                <option value="availability">In-Stock First</option>
            </select>
        </div>
        <div class="col-md-3">
            <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" id="available-only">
                <label class="form-check-label" for="available-only">In Stock Only</label>
            </div>
        </div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
        <!-- Dynamic products loaded here via JavaScript -->
    </div>
</main>

<script src="js/auth.js"></script>
<script src="js/products.js"></script>
</body>
</html>
