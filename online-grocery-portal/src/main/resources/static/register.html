<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RowdyPantry - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white fs-4" href="index.html">RowdyPantry</a>
        <div class="d-flex align-items-center gap-3">
            <a href="cart.html" class="btn btn-outline-light position-relative">
                Cart
                <span id="cart-badge" class="badge bg-danger rounded-pill">0</span>
            </a>
            <a href="login.html" class="btn btn-light btn-sm fw-semibold">Login</a>
        </div>
    </div>
</nav>

<div class="container my-5" style="max-width: 450px;">
    <div class="card card-summary p-4">
        <h3 class="fw-bold mb-3 text-center text-primary">Create an Account</h3>

        <div id="register-alert" class="alert d-none" role="alert"></div>

        <form id="register-form">
            <div class="mb-3">
                <label for="reg-name" class="form-label fw-semibold">Full Name</label>
                <input type="text" id="reg-name" class="form-control" placeholder="Rowdy Roadrunner" required>
            </div>

            <div class="mb-3">
                <label for="reg-email" class="form-label fw-semibold">Email address</label>
                <input type="email" id="reg-email" class="form-control" placeholder="runner@utsa.edu" required>
            </div>

            <div class="mb-3">
                <label for="reg-password" class="form-label fw-semibold">Password</label>
                <input type="password" id="reg-password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
            Already have an account? <a href="login.html" class="text-primary fw-bold">Log in</a>
        </p>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/register.js"></script>
</body>
</html>
