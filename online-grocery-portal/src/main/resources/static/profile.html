<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RowdyPantry - Profile & Addresses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white fs-4" href="index.html">RowdyPantry</a>
        <div class="d-flex align-items-center gap-3">
            <a href="cart.html" class="btn btn-outline-light position-relative">
                Cart <span id="cart-badge" class="badge bg-danger rounded-pill">0</span>
            </a>
            <div id="navbar-auth-container"></div>
        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="row g-4">
        <!-- Add Address Form -->
        <div class="col-md-5">
            <div class="card card-summary">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-primary mb-3">Add Delivery Address</h4>
                    <div id="address-alert" class="alert d-none" role="alert"></div>
                    <form id="address-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Street Address / Dorm</label>
                            <input type="text" class="form-control" id="street" placeholder="e.g. 1 UTSA Circle, Alvarez Hall #204" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text" class="form-control" id="city" value="San Antonio" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">State</label>
                                <input type="text" class="form-control" id="state" value="TX" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Zip Code</label>
                                <input type="text" class="form-control" id="zipCode" placeholder="78249" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Save Address</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Saved Addresses List -->
        <div class="col-md-7">
            <div class="card card-summary">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-primary mb-3">Saved Addresses</h4>
                    <div id="address-list-container" class="d-flex flex-column gap-3">
                        <!-- Addresses dynamically rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
